name: Validate Website
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate HTML
        run: npx --yes htmlhint index.html
      - name: Check files
        run: test -f css/theme.css && test -f css/style.css && test -f js/main.js
